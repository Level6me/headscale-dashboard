version: '3.8'

services:
  headscale-dashboard:
    build: .
    container_name: headscale-dashboard
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - HEADSCALE_URL=http://127.0.0.1:8085
      - HEADSCALE_API_KEY=
      - FEISHU_WEBHOOK=
    volumes:
      - ./backend/config.json:/app/backend/config.json
      - ./backend/node_metadata.json:/app/backend/node_metadata.json
      - ./backend/audit_logs.json:/app/backend/audit_logs.json
      - /etc/headscale:/etc/headscale:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8086/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
